[project]
name = "gimp-mcp"
version = "0.1.0"
description = "Servidor MCP para controlar GIMP 3 con detalle (capas, selecciones, pintura, texto, ajustes, filtros GEGL y PDB)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
gimp-mcp = "gimp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gimp_mcp"]
